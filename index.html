<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BizWise – Business feasibility & loan planner (SIH26091)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar" id="bar">
  <div class="brand"><b>BizWise</b><span id="brandSub"></span></div>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="bar-right">
    <span class="flag" id="sampleFlag" hidden></span>
    <label class="sr" for="lang">Language</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
      <option value="mr">मराठी</option>
    </select>
    <span class="who" id="who"></span>
    <button type="button" class="btn-link" id="logout" hidden></button>
  </div>
</header>
<main id="view"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
